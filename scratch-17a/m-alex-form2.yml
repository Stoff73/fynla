      - generic [ref=f197e210]:
        - paragraph [ref=f197e212]: Is there anything about my pensions the plan is still waiting on from me?
        - paragraph [ref=f197e214]:
          - text: Yes, Alex. Your plan is waiting for a
          - strong [ref=f197e215]: State Pension forecast
          - text: . It needs that to include your expected State Pension in your retirement picture. You can add the forecast amount and the age it is expected to start.You have one recorded workplace pension, valued at
          - strong [ref=f197e216]: £110,000.00
          - text: ", with contributions recorded as"
          - strong [ref=f197e217]: 6% from you and 8% from your employer
          - text: . The plan may also benefit from a target retirement age, which is not recorded.Would you like to add your State Pension forecast, or tell me your target retirement age first?
        - paragraph [ref=f197e219]: What monthly surplus does my plan show for me?
        - paragraph [ref=f197e221]:
          - text: Your plan shows a monthly surplus of
          - strong [ref=f197e222]: £2,846.18
          - text: after your take-home pay,
          - strong [ref=f197e223]: £1,900.00
          - text: monthly expenditure and recorded commitments.
        - paragraph [ref=f197e225]: "Tell me more about: Pay £28,000 more into your pension and save £11,200 in tax"
        - paragraph [ref=f197e227]:
          - text: The plan estimates that paying
          - strong [ref=f197e228]: £28,000.00
          - text: more into your pension could save
          - strong [ref=f197e229]: £11,200.00
          - text: "in Income Tax this tax year. Its calculation is:"
          - list [ref=f197e230]:
            - listitem [ref=f197e231]:
              - text: Your income this year is
              - strong [ref=f197e232]: £79,440.00
              - text: .
            - listitem [ref=f197e233]:
              - text: The higher rate starts at
              - strong [ref=f197e234]: £50,270.00
              - text: ", raised to"
              - strong [ref=f197e235]: £50,870.00
              - text: by your
              - strong [ref=f197e236]: £600.00
              - text: Gift Aid.
            - listitem [ref=f197e237]:
              - strong [ref=f197e238]: £480.00
              - text: of your savings interest is covered by your Personal Savings Allowance, so it is taxed at
              - strong [ref=f197e239]: 0%
              - text: .
            - listitem [ref=f197e240]:
              - text: That leaves
              - strong [ref=f197e241]: £28,090.00
              - text: taxed at 40%; rounded down to the nearest £100, the plan uses
              - strong [ref=f197e242]: £28,000.00
              - text: . At 40%, that gives the estimated
              - strong [ref=f197e243]: £11,200.00
              - text: tax saving.
          - text: Your recorded pension contributions so far are
          - strong [ref=f197e244]: £11,760.00
          - text: ", all paid by your employer through salary sacrifice. The plan’s suggested route is to ask your employer about increasing salary sacrifice, then pay any remaining amount into a personal pension and claim the additional relief through Self Assessment. Its suggested monthly amounts are based on the five months left in the tax year, and it notes that your cash pay after salary sacrifice must not fall below the National Minimum Wage.Your plan shows"
          - strong [ref=f197e245]: £2,846.18
          - text: monthly surplus, and your cash savings cover
          - strong [ref=f197e246]: 6.32 months
          - text: of expenditure. The retirement analysis is missing your target retirement age and target income, so it cannot show how this extra contribution would change a projection against your own retirement goal. The pension allowance check shows
          - strong [ref=f197e247]: £48,240.00
          - text: remaining for 2026/27, based on
          - strong [ref=f197e248]: £11,760.00
          - text: recorded so far against a
          - strong [ref=f197e249]: £60,000.00
          - text: allowance.Pension contributions are generally inaccessible until pension age, and investment values can fall as well as rise; past performance does not reliably predict future results. Tax treatment depends on your circumstances and may change. Would you like to look at the suggested payment route, or first add your retirement age and income target?For regulated advice personal to your circumstances, speak to a qualified financial adviser.
