        - heading "What our customers say" [level=2] [ref=f135e158]
        - generic [ref=f135e160]:
          - generic [ref=f135e161]:
            - generic [ref=f135e162]:
              - paragraph [ref=f135e174]: "\"I found the dashboard screens interesting, but the chat agent stole the show. Absolutely incredible. I spent an hour or so with it on Friday night and I left with the information I needed — very technical analysis of workplace pension options broken down in a very easy to understand way.\""
              - generic [ref=f135e175]: Stephen D.
            - generic [ref=f135e176]:
              - paragraph [ref=f135e188]: "\"It was so easy to see all my finances in one place. I had all current and savings accounts in different locations and had no idea what to do with my money. Fyn was really helpful in getting my information into Fynla, and then I had clear next steps on what I needed to do with my money.\""
              - generic [ref=f135e189]: Mia R.
            - generic [ref=f135e190]:
              - paragraph [ref=f135e202]: "\"Fynla has been a useful way to get a clearer picture of my finances without it feeling overwhelming. It pulls everything into one place, making it much easier to see where things stand. The recommendations are sensible and practical, giving me clear next steps rather than trying to do everything at once.\""
              - generic [ref=f135e203]: Anne L.
          - generic [ref=f135e204]:
            - generic [ref=f135e205]:
              - paragraph [ref=f135e217]: "\"Fynla alerted me that my fixed rate mortgage was expiring and that I could lock in a new rate up to six months before my term ended. I secured a competitive deal, and shortly after, interest rates jumped. I will save £1,400 a year!\""
              - generic [ref=f135e218]: Neil S.
            - generic [ref=f135e219]:
              - paragraph [ref=f135e231]: "\"Finally, everything in one place. Our family's assets, liabilities, insurance, and key financial information are all organised and easy to access. Fyn makes the whole experience feel effortless — intuitive, genuinely useful, and asks exactly the right questions. I can't imagine going back to spreadsheets.\""
              - generic [ref=f135e232]: Ron B.
            - generic [ref=f135e233]:
              - paragraph [ref=f135e245]: "\"I was sceptical about another finance app, but Fynla is different. It actually understands UK tax rules — ISA allowances, pension annual allowance, inheritance tax. Everything is calculated correctly.\""
              - generic [ref=f135e246]: Michael H.
