rface from the allowlist when adding a new tool) would silently break the boundary in one direction or the other. Mitigation: gate has its own dedicated test suite + every new tool requires a paired test for \"is this tool in the correct mode's allowlist?\". Add to PR checklist.\n- **Concurrent-turn queue grows unbounded if the worker dies.** Three queued messages times N active users times M minutes of downtime = a thundering herd when the worker restarts. Mitigation: queue depth cap (3) + queued-message TTL (suggest 10 min — if a queued message hasn't been processed in 10 min, mark as `expired` and surface via the resumption check rather than auto-process).\n- **Resumption surfacing UX.** The check at session start is a friction point — every new conversation could open with \"do you want to resume X?\". Mitigation: only fire the check when `pending_resumption` has been written within the last 7 days (configurable), and offer \"discard\" as a one-click option.\n- **Inactivity timer races with new turn arrival.** User sends a turn at minute 2:59 of the inactivity window. The summariser might be mid-run when the new turn lands. Mitigation: the summariser writes to `ai_conversations.summary` with an updated_at check (optimistic lock); if the conversation moved on, the summary write is discarded and re-triggered after the new turn completes.\n- **Eval rebaseline for `01-invariants.md` and `fyn-rubrics.md §B`.** Whichever collapse option we pick, the eval set still describes a Two-Fyn world. Even Option B (shared loop with shells) needs the invariants updated to reference the loop's behaviour, not just the shell-class behaviour. Budget time for this before Phase 5 merges to `main`.\n\n## Resolved open decisions (formerly \"Open decisions before Phase 1 starts\")\n\n- **Which existing store(s) back semantic memory?**\n  **Answer (v0.3, supersedes v0.2):** **Git-tracked `.md` corpus on disk + in-memory index at boot.** No database backing. Layout: `app/Resources/Memory/Semantic/{category}/{slug}.md`. YAML frontmatter (`fact_id`, `category`, `source`, `valid_from`, `valid_to`, `tax_year`, `version`). Embeddings computed by `php artisan fyn:semantic:reindex` into `storage/app/memory/semantic/embeddings.json` keyed by `fact_id`. Brute-force cosine ANN over the in-memory embeddings (expected corpus <500 files; brute-force is sub-millisecond). Rationale: matches CSJ's existing fynlaBrain Obsidian workflow; PR-style review of every fact change for free; no extra infrastructure to operate; effective-date diffs trivial on a PR; SiteGround shared-hosting friendly. Revisit if corpus exceeds ~10k files (boot time concern) or query latency exceeds 100ms p95.\n- **Tax-year and effective-date semantics for in-session retrieval: pin at session start, or re-resolve per cycle?**\n  **Answer:** **Pin at session start.** Set `WorkingMemory.tax_year` from `TaxConfigService::getActive()->tax_year` once when the session opens; carry through every cycle. Document the edge case: a session that opens at 23:59 on 5 April keeps the old tax year until next session. This matches the current `TaxConfigService` request-scoped cache behaviour and is what advisors expect (consistent advice within a single conversation).\n- **Naming convention for `procedure_id`.**\n  **Answer:** **Module-prefixed, dotted, SemVer-suffixed.** Examples: `fyn.advice.system_prompt_overlay.v2.4.0`, `fyn.onboarding.workflow.savings.v1.2.0`, `fyn.shared.fca_block.suitability.v1.0.3`, `fyn.shared.tool_schema.v3.0.0`. Module prefix (`fyn.{advice|onboarding|shared}`) makes the dispatch state unambiguous; SemVer suffix makes upgrade paths legible.\n- **Episode retention policy.**\n  **Answer:** **6 years for advice records; 12 months for verbatim forensic columns.** Per FCA SYSC 9.1 (records of suitability assessment, 5 years minimum + 1 year buffer), the structured episode (action, observation, recommendations, tools_called, snapshot ids) is retained 6 years. The verbatim `system_prompt` + `assembled_context` LONGTEXT columns are cold-archived after 12 months — they're forensic, not regulatory, and bloat the hot table. Verify with compliance before Phase 2 ships.\n- **Where does the planner live? Single LLM call returning typed action vs cheap classifier feeding a specialist.**\n  **Answer:** **Both, layered.** Keep the existing deterministic classifiers (`QueryClassifier`, `WriteIntentClassifier`, `RecordDuplicateChecker`) as the pre-planning short-circuit for unambiguous turns — they're cheap and they work. Add the LLM-based typed-action planner *above* them for ambiguous turns. A/B during Phase 5 to confirm the split is worth the latency.\n- **How strictly is the procedural store edited?**\n  **Answer:** **PR-style for Phase 4, wiki-style not before Phase 6.** All procedure changes go through git review for the foreseeable future — auditable, reviewable, revertable. The admin UI is read-only in Phase 4. Wiki-style editing is deferred until after Phase 6 ships and there's a proven track record of safe procedure changes; even then, it ships only for non-regulatory content (`house_view`, never `fca`).\n\n## Out of scope but worth flagging\n\n- A **reviewer Fyn** — a second agent that critiques draft advice before grounding — maps cleanly onto CoALA. It's just another agent with its own working memory and a shared semantic/episodic store. **Defer until Phase 6 is stable**, and respect the Two-Fyn dispatch contract: a reviewer is a third dispatch state, not a replacement for AdviceFyn or OnboardingChatDirector.\n- **Cross-client episodic retrieval** (anonymised similar-case recall) is powerful but raises GDPR and FCA questions that deserve their own spec.\n- **Procedural learning at the LLM-weights level** (fine-tuning on episode summaries) is plausible in 12+ months once the data is large and clean enough. Out of scope for this plan.\n- **Mobile (iOS Capacitor) implications** — the mobile dashboard caches per-user for 5 minutes and the chat surface streams over SSE with WKWebView quirks. Phase 5 cost telemetry surfaces should account for mobile-cached responses (zero LLM cost when served from cache). Detailed mobile handling deferred to Phase 5 sub-plan.\n\n---\n\n**Next actions**\n\n1. Re-read this revised plan against `April/April24Updates/spec/00-canonical.md` and confirm no constraint in the \"Constraints we must preserve\" section is misstated. Decide whether the canonical contract is being revised (Option A — full collapse) or preserved (Option B — shared loop with shells). v0.4 recommends Option B; final call is CSJ's.\n2. Draft the Phase 1 sub-plan: semantic memory schema migration, retrieval API contract, embedding model choice (Anthropic vs xAI vs OpenAI for embeddings — note the project already uses both Anthropic and xAI for chat), seed-data inventory by category, and the FCA-chunking pass over `app/Services/AI/Prompts/*`.\n3. Stand up the one-page Fyn PRD under this architecture so product framing and technical framing stay aligned. PRD should reference this plan's Constraints section directly.\n4. Before any Phase 1 code lands on `main`: ship Phase 5's prompt-cache telemetry on its own so we have a baseline against which to measure the semantic-memory wiring's prefix-cache impact.\n5. Build the `ground` action surface gate (Phase 5 critical path) in its own dedicated PR with its own dedicated test suite, before any planner work lands. This is the new mechanical write-safety boundary regardless of Option A vs B.\n6. Decide the concurrent-turn queue TTL (suggested 10 min) and resumption surfacing window (suggested 7 days) — both are minor UX knobs with non-trivial behaviour at scale.\n";

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
  (function () {
    var contentEl = document.getElementById('content');
    function showError(msg) {
      contentEl.classList.remove('loading');
      var div = document.createElement('div');
      div.className = 'render-error';
      div.textContent = msg;
      contentEl.textContent = '';
      contentEl.appendChild(div);
    }
    var raw = window.__FYNLA_COALA_MD__;
    if (typeof raw !== 'string') { showError('Plan content missing.'); return; }
    if (typeof marked === 'undefined') { showError('Markdown renderer failed to load. If you opened this from file://, some browsers block CDN fetches — try opening via a local web server, or view the .md file directly.'); return; }
    if (typeof DOMPurify === 'undefined') { showError('Sanitiser failed to load. Refusing to render unsanitised content.'); return; }
    var hasMermaid = typeof mermaid !== 'undefined';

    // Marked renderer: emit mermaid blocks as <div class="mermaid"> so mermaid
    // can find and replace them with SVG after sanitisation.
    var renderer = new marked.Renderer();
    var baseCode = renderer.code.bind(renderer);
    renderer.code = function (code, lang) {
      if (lang === 'mermaid') {
        // Escape for HTML attribute / text node; mermaid reads textContent so
        // the rendered SVG comes from the trusted markdown source, not user input.
        var esc = code
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
        return '<div class="mermaid">' + esc + '</div>';
      }
      return baseCode(code, lang);
    };
    marked.setOptions({ renderer: renderer, gfm: true, breaks: false, headerIds: true, mangle: false });

    var dirty = marked.parse(raw);
    var clean = DOMPurify.sanitize(dirty, {
      USE_PROFILES: { html: true },
      ADD_ATTR: ['id', 'class']
    });
    contentEl.classList.remove('loading');
    contentEl.innerHTML = clean;

    if (hasMermaid) {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'base',
        securityLevel: 'strict',
        flowchart: { curve: 'basis', htmlLabels: true, useMaxWidth: true },
        sequence: { useMaxWidth: true, mirrorActors: false },
        themeVariables: {
          fontFamily: '"Segoe UI", Inter, system-ui, -apple-system, sans-serif',
          fontSize: '14px',
          background: '#FFFFFF',
          primaryColor: '#FCE7F3',
          primaryTextColor: '#1F2A44',
          primaryBorderColor: '#E83E6D',
          secondaryColor: '#EDE9FE',
          secondaryBorderColor: '#5854E6',
          secondaryTextColor: '#1F2A44',
          tertiaryColor: '#D1FAE5',
          tertiaryBorderColor: '#20B486',
          tertiaryTextColor: '#1F2A44',
          lineColor: '#1F2A44',
          textColor: '#1F2A44',
          mainBkg: '#FCE7F3',
          nodeBorder: '#1F2A44',
          clusterBkg: '#FDFAF7',
          clusterBorder: '#CBD5E1',
          edgeLabelBackground: '#F7F6F4',
          actorBkg: '#FCE7F3',
          actorBorder: '#E83E6D',
          actorTextColor: '#1F2A44',
          actorLineColor: '#1F2A44',
          signalColor: '#1F2A44',
          signalTextColor: '#1F2A44',
          labelBoxBkgColor: '#F7F6F4',
          labelBoxBorderColor: '#1F2A44',
          labelTextColor: '#1F2A44',
          noteBkgColor: '#FDFAF7',
          noteBorderColor: '#CBD5E1',
          noteTextColor: '#1F2A44'
        }
      });
      try {
        mermaid.run({ querySelector: '.mermaid', suppressErrors: false });
      } catch (e) {
        console.error('Mermaid render error:', e);
      }
    }

    // Build the TOC from H2 headings.
    var tocList = document.getElementById('toc-list');
    var headings = contentEl.querySelectorAll('h2');
    headings.forEach(function (h, i) {
      if (!h.id) { h.id = 'section-' + i; }
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace(/\s*\(NEW( in v[0-9.]+)?\)\s*$/, '');
      li.appendChild(a);
      tocList.appendChild(li);
    });

    function setActive() {
      var anchors = tocList.querySelectorAll('a');
      var current = null;
      headings.forEach(function (h) {
        var rect = h.getBoundingClientRect();
        if (rect.top <= 120) { current = h.id; }
      });
      anchors.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + current);
      });
    }
    window.addEventListener('scroll', setActive, { passive: true });
    setActive();
  })();
</script>
