id: fyn-19079-repetition
finding_ids:
  - FYN-19079
environment: csjones
user:
  kind: dedicated_qa
  email_ref: CSJONES_FYN_QA_EMAIL
surfaces:
  - name: desktop
    start_url: https://csjones.co/fynla
    steps:
      - action: provision
        target: completed-onboarding QA user with retirement data and zero goals
        assert: User has retirement data, no goals, no active campaign, and no onboarding step
        evidence: evidence/fyn-19079/01-desktop-user-state.json
      - action: ask
        target: Am I on track for retirement?
        assert: Fyn returns one complete retirement answer without a goals prerequisite gate
        evidence: evidence/fyn-19079/02-desktop-answer.png
      - action: inspect-stream
        target: desktop conversation stream and tool audit
        assert: No identical tool executes more than once and no paragraph repeats
        evidence: evidence/fyn-19079/03-desktop-stream.json
      - action: inspect-database
        target: ai_messages rows for the desktop conversation
        assert: Exactly one user turn and one assistant answer of 100 to 8000 characters are persisted
        evidence: evidence/fyn-19079/04-desktop-ai-messages.json
  - name: mobile
    start_url: https://csjones.co/fynla/m
    steps:
      - action: inspect-frame
        target: mobile application iframe signed in as the same completed-onboarding QA user
        assert: Mobile resolves the user to advice state with no active onboarding flow
        evidence: evidence/fyn-19079/05-mobile-user-state.png
      - action: ask
        target: Am I on track for retirement?
        assert: Fyn returns one complete retirement answer without a goals prerequisite gate
        evidence: evidence/fyn-19079/06-mobile-answer.png
      - action: inspect-stream
        target: mobile conversation stream and tool audit
        assert: No identical tool executes more than once and no paragraph repeats
        evidence: evidence/fyn-19079/07-mobile-stream.json
      - action: compare-state
        target: desktop and mobile dispatch, answer, and persisted conversation state
        assert: Both surfaces use advice state and persist equivalent single-answer outcomes
        evidence: evidence/fyn-19079/08-surface-comparison.json
negative_assertions:
  - no goals prerequisite gate
  - no repeated paragraph
  - no identical tool executed more than once per answer
  - no duplicate or unbounded ai_messages rows
  - no desktop/mobile state divergence
  - no console errors
  - no unexpected 4xx or 5xx API responses
cleanup:
  - restore the standing QA user to its pre-run completed-onboarding state
  - delete conversations and records created by this acceptance run
