id: protection_2x_unknown_providers
category: 03-multi-entity
description: |
  Onboarding asset_capture turn (NOT advice). User dictates two
  protection policies with two UNKNOWN (off-list) providers. Tests
  that recall is preserved without matching against any KNOWN_PROVIDERS
  list — `provider` is a free-text string. Value accuracy and
  cross-entity consistency must hold even when provider names are
  unfamiliar.

  Dispatches to OnboardingChatDirector::handleUserMessage; AdviceFyn /
  KYC / ProtectionAgent are bypassed.

input:
  turns:
    - user: "I have a life policy with Quilter Mutual for £250,000 and an income protection policy with Holloway Friendly for £180,000."

seed:
  user:
    first_name: Test
    surname: User
    onboarding_completed: false
    onboarding_fyn_step: asset_capture

expected_classification_shape:
  primary: data_entry
  related: []
  modules: []

expected_response_mode: factual
expected_engine_call_level: factual
expected_kyc_state: bypass

expected_tool_calls:
  - tool: create_protection_policy
    args: { provider: Quilter Mutual, policy_type_group: life, sum_assured: 250000 }
    required: true
    result_path: success
  - tool: create_protection_policy
    args: { provider: Holloway Friendly, policy_type_group: income_protection, sum_assured: 180000 }
    required: true
    result_path: success

expected_sse_events:
  must_contain_types: [tool_use, entity_created, content, done]
  must_emit_exactly_once:
    - done
  must_emit_exactly:
    entity_created: 2
    tool_use: 2
  must_not_emit:
    - persona_state_change
    - handoff

expected_db_writes:
  protection_policies: 2
expected_db_writes_persistent: true

forbidden_outputs:
  - "I'm not sure what you said"
  - "I don't recognise that provider"
  - "please use a known provider"
  - "Quilter Mutual is not a recognised provider"
  - "Holloway Friendly is not a recognised provider"
  - "For regulated advice personal to your circumstances"   # INV-2.3.3 — capture-mode does NOT signpost

forbidden_tools:
  - create_savings_account
  - create_investment_account
  - create_pension
  - delegate_to_capture

eval_focus:
  module: protection
  expected_entity_count: 2
  recall_floor: 95
  precision_floor: 95
  value_accuracy: 100
  cross_entity_consistency: 100
  fabrication_rate: 0

timing_budget_ms:
  anthropic:
    happy: 8000
  xai:
    happy: 18000

tags:
  - regression-band-0
  - capture-mode
  - protection
  - multi-entity
  - unknown-provider
