id: protection_2x_unknown_providers
category: 03-multi-entity
description: |
  Onboarding asset_capture: user dictates two protection policies with two
  UNKNOWN (off-list) providers. Tests that recall is preserved without
  matching against the KNOWN_PROVIDERS list — value accuracy and cross-entity
  consistency must hold even when provider names are unfamiliar.

input:
  turns:
    - user: "I have a life policy with Quilter Mutual for £250,000 and an income protection policy with Holloway Friendly for £180,000."

seed:
  user:
    first_name: Test
    surname: User
    onboarding_completed: false
    onboarding_fyn_step: asset_capture

expected_classifications:
  - data_entry

expected_tool_calls:
  - tool: create_protection_policy
    args: { provider: Quilter Mutual, policy_type_group: life, sum_assured: 250000 }
  - tool: create_protection_policy
    args: { provider: Holloway Friendly, policy_type_group: income_protection, sum_assured: 180000 }

expected_sse_events:
  - { type: tool_use, name: create_protection_policy }
  - { type: entity_created, entity_type: protection_policy }
  - { type: tool_use, name: create_protection_policy }
  - { type: entity_created, entity_type: protection_policy }
  - { type: content }
  - { type: done }

expected_db_writes:
  protection_policies: 2

forbidden_outputs:
  - "I'm not sure what you said"
  - "I don't recognise that provider"

forbidden_tools:
  - create_savings_account
  - create_investment_account
  - create_pension

eval_focus:
  module: protection
  expected_entity_count: 2
  recall_floor: 95
  precision_floor: 95
  value_accuracy: 100
  cross_entity_consistency: 100
  fabrication_rate: 0

timing_budget_ms: 8000

tags:
  - regression-band-0
  - capture-mode
  - protection
  - multi-entity
  - unknown-provider
