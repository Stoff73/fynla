id: pensions_2x_schemes
category: 03-multi-entity
description: |
  Onboarding asset_capture turn (NOT advice). User dictates two
  workplace pension schemes — one historic ("old") and one current —
  in a single message. Dispatches to OnboardingChatDirector::handleUserMessage;
  AdviceFyn / KYC bypassed.

  Tests recall (2/2), cross-entity consistency (correct provider per
  current_value), value accuracy (£45,000 / £80,000), and that
  scheme_type AND the temporal qualifier (`is_active`) are preserved
  per pension. The "old" qualifier maps to is_active=false on the
  Standard Life entry; the "current" one maps to is_active=true on
  Aviva.

input:
  turns:
    - user: "I have an old workplace pension at Standard Life worth £45,000 and my current workplace pension is with Aviva worth £80,000."

seed:
  user:
    first_name: Test
    surname: User
    onboarding_completed: false
    onboarding_fyn_step: asset_capture

expected_classification_shape:
  primary: data_entry
  related: []
  modules: []

expected_response_mode: factual
expected_engine_call_level: factual
expected_kyc_state: bypass

expected_tool_calls:
  - tool: create_pension
    args: { provider: Standard Life, scheme_type: workplace, current_value: 45000, is_active: false }
    required: true
    result_path: success
  - tool: create_pension
    args: { provider: Aviva, scheme_type: workplace, current_value: 80000, is_active: true }
    required: true
    result_path: success

expected_sse_events:
  must_contain_types: [tool_use, entity_created, content, done]
  must_emit_exactly_once:
    - done
  must_emit_exactly:
    entity_created: 2
    tool_use: 2
  must_not_emit:
    - persona_state_change
    - handoff

expected_db_writes:
  dc_pensions: 2
expected_db_writes_persistent: true

forbidden_outputs:
  - "I'm not sure what you said"
  - "For regulated advice personal to your circumstances"   # INV-2.3.3 — capture-mode does NOT signpost

forbidden_tools:
  - create_protection_policy
  - create_savings_account
  - create_investment_account
  - delegate_to_capture

eval_focus:
  module: retirement
  expected_entity_count: 2
  recall_floor: 95
  precision_floor: 95
  value_accuracy: 100
  cross_entity_consistency: 100
  fabrication_rate: 0

timing_budget_ms:
  anthropic:
    happy: 8000
  xai:
    happy: 18000

tags:
  - regression-band-0
  - capture-mode
  - retirement
  - pensions
  - multi-entity
  - temporal-qualifier-is-active
