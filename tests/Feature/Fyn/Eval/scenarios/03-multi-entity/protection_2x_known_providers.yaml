id: protection_2x_known_providers
category: 03-multi-entity
description: |
  Onboarding asset_capture turn (NOT advice). User dictates two
  protection policies with two KNOWN providers in a single message.
  Dispatches to OnboardingChatDirector::handleUserMessage based on
  users.onboarding_completed = false (per CANON line 11). The
  asset_capture handler invokes the LLM with the create_* tool
  catalogue and writes both policies via direct-write tool handlers.

  This scenario does NOT go through AdviceFyn — KycGateChecker /
  ProtectionAgent / response_mode_map are bypassed entirely. The
  expected_response_mode / engine_call_level / kyc_state values
  below document that fact rather than asserting an actual code path.

  Tests entity recall (2/2), cross-entity consistency (no field-bleed
  Aviva↔Vitality, life↔CI), and value accuracy (£300,000 / £100,000
  round-trip exactly).

input:
  turns:
    - user: "I have an Aviva life policy for £300,000 and Vitality critical illness for £100,000."

seed:
  user:
    first_name: Test
    surname: User
    onboarding_completed: false
    onboarding_fyn_step: asset_capture

expected_classification_shape:
  primary: data_entry
  related: []
  modules: []

expected_response_mode: factual
expected_engine_call_level: factual
expected_kyc_state: bypass

expected_tool_calls:
  - tool: create_protection_policy
    args: { provider: Aviva, policy_type_group: life, sum_assured: 300000 }
    required: true
    result_path: success
  - tool: create_protection_policy
    args: { provider: Vitality, policy_type_group: critical_illness, sum_assured: 100000 }
    required: true
    result_path: success

expected_sse_events:
  must_contain_types: [tool_use, entity_created, content, done]
  must_emit_exactly_once:
    - done
  must_emit_exactly:
    entity_created: 2
    tool_use: 2
  must_not_emit:
    - persona_state_change
    - handoff

expected_db_writes:
  protection_policies: 2
expected_db_writes_persistent: true

forbidden_outputs:
  - "I'm not sure what you said"
  - "For regulated advice personal to your circumstances"   # INV-2.3.3 — capture-mode does NOT signpost

forbidden_tools:
  - create_savings_account
  - create_investment_account
  - create_pension
  - delegate_to_capture     # CANON line 26-29 — onboarding does not hand off to itself

eval_focus:
  module: protection
  expected_entity_count: 2
  recall_floor: 95
  precision_floor: 95
  value_accuracy: 100
  cross_entity_consistency: 100
  fabrication_rate: 0

timing_budget_ms:
  anthropic:
    happy: 8000
  xai:
    happy: 18000

tags:
  - regression-band-0
  - capture-mode
  - protection
  - multi-entity
  - known-provider
