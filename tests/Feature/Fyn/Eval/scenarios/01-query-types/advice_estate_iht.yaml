id: advice_estate_iht
category: 01-query-types
description: |
  User asks "How much inheritance tax will my estate pay?". Classifier
  resolves to ESTATE_IHT (primary), related: [property, estate_planning],
  modules: [estate, property] — verified via QueryClassifier.

  NOTE: `estate_planning` appears in `related` because the message
  contains the word "will" (used here as a modal verb), which matches
  the ESTATE_PLANNING keyword pattern `/\bwill(s)?\b/i`. This is a
  classifier behaviour quirk — the verb-vs-noun ambiguity of "will"
  cannot be resolved by regex alone. The merged REQUIRED_TOOLS list
  is unaffected (estate_planning's only tool is get_module_analysis(estate),
  already present and deduped) so this does not change the tool sequence.

  Universal KYC passes (DOB 1968 → age 58, married, employed, £75k,
  £3500). Estate module readiness passes (RDY-EST: DOB ✓, marital ✓,
  at_least_one_asset ✓ — seed has property + savings + investment).
  Property module has no KYC actionMap entry. KYC overall: PASSED.

  EstateAgent::analyze() loads the user with relations and runs the full
  IHT calculation — no secondary profile gate. TRC path 4 happy: full
  payload with REQUIRED_KEYS [summary, asset_breakdown, iht_calculation,
  trust_recommendations, gifting_opportunities, life_cover, profile,
  missing_for_quality_advice].

  Estate composition: £600k main residence − £100k mortgage = £500k
  net residence + £50k savings + £80k Stocks & Shares ISA = £630k
  total. NRB £325k + RNRB £175k = £500k threshold. Taxable estate
  ≈ £130k @ 40% ≈ £52k IHT before any spousal exemption.

  Tools fired (merged from QuerySchemas::getRequiredToolsForClassification):
  3 unique tools — get_tax_information(inheritance_tax), get_module_analysis(estate),
  list_records(property). estate_planning's tool dedups. Plus get_recommendations
  because the estate module is ready (can_proceed=true).

input:
  turns:
    - user: "How much inheritance tax will my estate pay?"

seed:
  user:
    first_name: Test
    surname: User
    date_of_birth: '1968-04-15'
    marital_status: married
    employment_status: employed
    annual_employment_income: 75000
    monthly_expenditure: 3500
    onboarding_completed: true
  properties:
    - { property_type: main_residence, current_value: 600000, mortgage_balance: 100000 }
  savings_accounts:
    - { provider: HSBC, account_type: easy_access, balance: 50000 }
  investment_accounts:
    - { provider: Vanguard, account_type: stocks_shares_isa, balance: 80000 }

expected_classification_shape:
  primary: estate_iht
  related:
    - property
    - estate_planning
  modules:
    - estate
    - property

expected_response_mode: recommendation
expected_engine_call_level: module
expected_kyc_state: passed

expected_tool_calls:
  - tool: get_tax_information
    args: { topic: inheritance_tax }
    required: true
    result_path: happy
  - tool: get_module_analysis
    args: { module: estate }
    required: true
    result_path: happy
  - tool: list_records
    args: { entity_type: property }
    required: true
    result_path: happy
  - tool: get_recommendations
    required: true
    condition: "Estate module is ready (can_proceed=true) — PrerequisiteGateService::canGetRecommendations gate passes."

expected_sse_events:
  must_contain_types: [title, content, tool_use, done]
  must_emit_exactly_once:
    - done
    - title
  must_not_emit:
    - persona_state_change
    - handoff
  content_event_minimum: 15
  tool_use_count_min: 3
  tool_use_count_max: 5

expected_assistant_text:
  must_contain_substrings:
    - "For regulated advice personal to your circumstances, speak to a qualified financial adviser."
  must_contain_at_least_one_of:
    - ["Nil Rate Band", "nil rate band", "£325"]
    - ["Residence Nil Rate Band", "residence nil rate band", "£175"]
  must_not_contain_substrings:
    - "I think you should"
    - "I'd recommend"
    - "In my opinion"
    - "you should definitely"
  minimum_length_chars: 400
  maximum_length_chars: 3000

forbidden_outputs:
  - "I think you should"
  - "I'd recommend"
  - "In my opinion"
  - "you definitely should"

forbidden_tools:
  - create_estate_gift
  - create_will
  - update_will
  - create_power_of_attorney
  - update_power_of_attorney
  - create_trust
  - update_record
  - delete_record

timing_budget_ms:
  anthropic:
    happy: 9000
  xai:
    happy: 18000

tags:
  - regression-band-0
  - recommendation-mode
  - estate
  - iht
  - happy-path
  - iht-calculation
  - cleanest-recommendation-scenario
  - related-includes-estate-planning-modal-will-fp
