id: advice_savings_emergency
category: 01-query-types
description: |
  User asks "Do I have enough emergency savings?". Classifier resolves
  to SAVINGS_EMERGENCY (primary), related: [affordability], modules:
  [savings, income] — verified via QueryClassifier. Universal KYC passes
  (DOB 1985, married, employed, £50k income, £2500 expenditure all
  seeded). Savings module readiness passes (RDY-SAV blocking: DOB ✓,
  income ✓, expenditure ✓). Income module has no KYC actionMap entry.

  SavingsAgent::analyze() runs the full happy path — no secondary
  profile gate (AGT-SAV). Returns the per-module REQUIRED_KEYS payload
  via TRC path 4: summary, emergency_fund, isa_allowance, liquidity,
  rate_comparisons, goals, missing_for_quality_advice.

  Seed: £4,500 in a Nationwide easy-access account at 4.5%; monthly
  expenditure £2,500. Runway = 4500 / 2500 = 1.8 months — substantially
  below the conventional 3-6 month target.

  Tools fired: list_records(savings_account) → happy;
  get_module_analysis(savings) → happy. AFFORDABILITY's REQUIRED_TOOLS
  is `get_module_analysis(savings)` (already in the list, dedup).
  get_recommendations fires because the savings module is ready —
  PrerequisiteGateService::canGetRecommendations returns can_proceed=true.

input:
  turns:
    - user: "Do I have enough emergency savings?"

seed:
  user:
    first_name: Test
    surname: User
    date_of_birth: '1985-04-15'
    marital_status: married
    employment_status: employed
    annual_employment_income: 50000
    monthly_expenditure: 2500
    onboarding_completed: true
  savings_accounts:
    - { provider: Nationwide, account_type: easy_access, balance: 4500, interest_rate: 4.50 }

expected_classification_shape:
  primary: savings_emergency
  related:
    - affordability
  modules:
    - savings
    - income

expected_response_mode: recommendation
expected_engine_call_level: module
expected_kyc_state: passed

expected_tool_calls:
  - tool: list_records
    args: { record_type: savings_account }
    required: true
    result_path: happy
  - tool: get_module_analysis
    args: { module: savings }
    required: true
    result_path: happy
  - tool: get_recommendations
    required: true
    condition: "Savings module is ready (can_proceed=true) — PrerequisiteGateService::canGetRecommendations gate passes."

expected_sse_events:
  must_contain_types: [title, content, tool_use, done]
  must_emit_exactly_once:
    - done
    - title
  must_not_emit:
    - persona_state_change
    - handoff
  content_event_minimum: 8
  tool_use_count_min: 2
  tool_use_count_max: 4

expected_assistant_text:
  must_contain_substrings:
    - "For regulated advice personal to your circumstances, speak to a qualified financial adviser."
  must_contain_at_least_one_of:
    - ["1.8", "1.8 months", "less than 2 months", "less than two months", "below"]
    - ["£4,500", "£4500"]
  must_not_contain_substrings:
    - "I think you should"
    - "I'd recommend"
    - "In my opinion"
  minimum_length_chars: 250
  maximum_length_chars: 2500

forbidden_outputs:
  - "I think you should"
  - "I'd recommend"
  - "In my opinion"

forbidden_tools:
  - create_savings_account
  - update_savings_account
  - delete_savings_account
  - update_record
  - delete_record

timing_budget_ms:
  anthropic:
    happy: 7000
  xai:
    happy: 16000

tags:
  - regression-band-0
  - recommendation-mode
  - savings
  - happy-path
  - affordability-implicit-related
