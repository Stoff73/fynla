id: advice_retirement_contribution
category: 01-query-types
description: |
  User asks "Should I increase my pension contributions?" — Advice Fyn classifies
  as `retirement_contribution`, calls get_module_analysis(retirement) +
  get_recommendations, emits content + done. No write tools.

input:
  turns:
    - user: "Should I increase my pension contributions?"

seed:
  user:
    first_name: Test
    surname: User
    onboarding_completed: true
    annual_income: 50000
  dc_pensions:
    - { provider: Standard Life, scheme_type: workplace, current_value: 45000, monthly_contribution: 250, employer_contribution: 250 }

expected_classifications:
  - retirement_contribution

expected_tool_calls:
  - tool: get_module_analysis
    args: { module: retirement }
  - tool: get_recommendations

expected_sse_events:
  - { type: content }
  - { type: done }

expected_advice_response:
  signposting_suffix_present: true
  has_recommendations: true
  note: "S1.6 adds the advice_response SSE event; this scenario's expected_sse_events updates then."

forbidden_outputs:
  - "I think you should"
  - "I'd recommend"
  - "In my opinion"

forbidden_tools:
  - create_pension
  - update_pension
  - delete_pension

timing_budget_ms: 5000

tags:
  - regression-band-0
  - recommendation-mode
  - retirement
