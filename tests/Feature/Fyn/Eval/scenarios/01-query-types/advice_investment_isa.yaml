id: advice_investment_isa
category: 01-query-types
description: |
  User asks "Should I contribute more to my Stocks & Shares ISA?".
  Classifier resolves to INVESTMENT_PORTFOLIO (primary), related:
  [affordability], modules: [investment, savings, income] — verified
  via QueryClassifier.

  Universal KYC passes (DOB 1985, married, employed, £50k income,
  £2500 expenditure all seeded). BUT the investment module readiness
  gate (RDY-INV blocking checks) fails: a completed `risk_profile`
  is required and the seed does not provide one. KycGateChecker
  returns BLOCKED with exact route /investment/risk-profile —
  verified via PrerequisiteGateService::enforce('investment', $user).

  Per the KYC-blocked prompt block, the LLM is instructed NOT to
  call analysis tools and to navigate the user to the missing data.
  navigate_to_page is stripped from advice mode (AFYN-WRITE line 151,
  S0.5.t) so the LLM provides text-only navigation guidance pointing
  to /investment/risk-profile.

  Tools fired: none of the analysis tools. The LLM may still call
  list_records(investment_account) to look at what's there, which is
  allowed but not required. get_module_analysis and get_recommendations
  must NOT fire — KYC blocked is the contract.

input:
  turns:
    - user: "Should I contribute more to my Stocks & Shares ISA?"

seed:
  user:
    first_name: Test
    surname: User
    date_of_birth: '1985-04-15'
    marital_status: married
    employment_status: employed
    annual_employment_income: 50000
    monthly_expenditure: 2500
    onboarding_completed: true
  investment_accounts:
    - { provider: Vanguard, account_type: stocks_shares_isa, balance: 12000, ytd_contribution: 4000 }

expected_classification_shape:
  primary: investment_portfolio
  related:
    - affordability
  modules:
    - investment
    - savings
    - income

expected_response_mode: recommendation
expected_engine_call_level: module
expected_kyc_state: blocked
expected_kyc_missing:
  - label: "A completed risk profile is essential to determine suitable asset allocation and investment recommendations."
    route: "/investment/risk-profile"

expected_tool_calls: []

expected_tool_calls_absent:
  - get_module_analysis
  - get_recommendations
  - generate_financial_plan
  - navigate_to_page

expected_sse_events:
  must_contain_types: [title, content, done]
  must_emit_exactly_once:
    - done
    - title
  must_not_emit:
    - persona_state_change
    - handoff
  content_event_minimum: 5
  tool_use_count_min: 0
  tool_use_count_max: 1

expected_assistant_text:
  must_contain_substrings:
    - "/investment/risk-profile"
  must_contain_at_least_one_of:
    - ["risk profile", "risk tolerance", "attitude to risk"]
  must_not_contain_substrings:
    - "I think you should"
    - "I'd recommend"
    - "In my opinion"
    - "you should definitely"
    - "For regulated advice personal to your circumstances"   # INV-2.3.3 — KYC-blocked is not a recommendation; signposting must NOT append
    - "You can contribute £20,000"                              # guards against fabricated ISA-allowance advice without the risk-profile context
    - "You should contribute"
  minimum_length_chars: 150
  maximum_length_chars: 2500

forbidden_outputs:
  - "I think you should"
  - "I'd recommend"
  - "In my opinion"
  - "You should contribute"
  - "You can contribute £20,000"

forbidden_tools:
  - create_investment_account
  - update_investment_account
  - delete_investment_account
  - create_holding
  - update_record
  - delete_record
  - get_module_analysis      # KYC blocked — explicitly told NOT to call
  - get_recommendations
  - generate_financial_plan
  - navigate_to_page         # stripped from advice mode (AFYN-WRITE)

timing_budget_ms:
  anthropic:
    kyc_blocked: 5000
  xai:
    kyc_blocked: 12000

tags:
  - regression-band-0
  - recommendation-mode
  - investment
  - isa
  - kyc-blocked-path
  - risk-profile-required
  - navigate-to-page-stripped
