id: advice_protection_cover
category: 01-query-types
description: |
  User asks "Am I covered enough for protection?". Classifier now resolves
  to PROTECTION_COVER (primary), related: [], modules: [protection]
  — verified via QueryClassifier. Universal KYC passes (DOB 1985, married,
  employed, £50k income, £2500 expenditure all seeded). Module readiness
  passes (RDY-PROT blocking checks: DOB ✓, income ✓, marital_status ✓).

  But ProtectionAgent::analyze() (AGT-PROT line 72) requires a
  `protection_profile` row — the seed creates only one
  `life_insurance_policies` row. The agent returns:
    {success: false, message: "Protection profile not found...", data: []}
  — TRC path 0 (success_false), passes through verbatim.

  Expected tool sequence: list_records(life_insurance) → happy;
  get_module_analysis(protection) → success_false. get_recommendations
  does NOT fire — PrerequisiteGateService::canGetRecommendations
  cannot find a ready module to recommend on.

  The LLM should explain the missing profile fields (spouse income,
  dependants, debts) and ask the user, no FCA recommendation given.

input:
  turns:
    - user: "Am I covered enough for protection?"

seed:
  user:
    first_name: Test
    surname: User
    date_of_birth: '1985-04-15'
    marital_status: married
    employment_status: employed
    annual_employment_income: 50000
    monthly_expenditure: 2500
    onboarding_completed: true
  protection_policies:
    - { provider: Aviva, policy_type_group: life, sum_assured: 100000, premium_amount: 25, premium_frequency: monthly }

expected_classification_shape:
  primary: protection_cover
  related: []
  modules:
    - protection

expected_response_mode: recommendation
expected_engine_call_level: module
expected_kyc_state: passed

expected_tool_calls:
  - tool: list_records
    args: { record_type: life_insurance }
    required: true
    result_path: happy
  - tool: get_module_analysis
    args: { module: protection }
    required: true
    result_path: success_false
    result_message_contains: "Protection profile not found"
  - tool: get_recommendations
    required: false
    condition: "Will not fire on the success_false path — PrerequisiteGateService::canGetRecommendations returns can_proceed=false when no module is ready."

expected_sse_events:
  must_contain_types: [title, content, tool_use, done]
  must_emit_exactly_once:
    - done
    - title
  must_not_emit:
    - persona_state_change   # INV-2.4.1
    - handoff                # INV-2.4.1 — internal, never reaches frontend
  content_event_minimum: 5
  tool_use_count_min: 1
  tool_use_count_max: 4

expected_assistant_text:
  must_contain_substrings:
    - "For regulated advice personal to your circumstances, speak to a qualified financial adviser."
  must_contain_at_least_one_of:
    - ["protection profile", "spouse", "dependants", "debts", "mortgage"]
  must_not_contain_substrings:
    - "I think you should"
    - "I'd recommend"
    - "In my opinion"
    - "you should definitely"
  minimum_length_chars: 200
  maximum_length_chars: 2500

forbidden_outputs:
  - "I think you should"
  - "I'd recommend"
  - "In my opinion"
  - "you should definitely"

forbidden_tools:
  - create_protection_policy
  - update_protection_policy
  - delete_protection_policy
  - update_record
  - delete_record

timing_budget_ms:
  anthropic:
    success_false: 6000
  xai:
    success_false: 14000

tags:
  - regression-band-0
  - recommendation-mode
  - protection
  - success-false-path
  - protection-profile-required
